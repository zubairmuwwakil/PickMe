name: Document freshness (advisory)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecosystem-freshness:
    name: ecosystem-freshness (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare ECOSYSTEM.md with MoneyTalks main
        run: |
          set -euo pipefail
          canonical="$(mktemp)"
          trap 'rm -f "$canonical"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/zubairmuwwakil/MoneyTalks/refs/heads/main/ECOSYSTEM.md" \
            --output "$canonical"
          if ! diff -u "$canonical" ECOSYSTEM.md; then
            echo "::error::ECOSYSTEM.md has drifted from MoneyTalks main"
            exit 1
          fi
          echo "ECOSYSTEM.md is current with MoneyTalks main"

  # Belongs here rather than in ci.yml on purpose. The schema gate in the catalogue-release job
  # asks whether a source was cited when a row was written; it never asks again. Acceptance moves
  # without announcement, and a merchant that STARTS taking Amex breaks nothing a test can see —
  # the row decodes, the pack validates, and the app keeps telling the owner to leave their best
  # card in their pocket. A row ageing past the bar is a prompt to re-read a page, not a reason to
  # block an unrelated merge, which is what the weekly cron is for.
  acceptance-freshness:
    name: acceptance-freshness (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Narrowed merchant rows were verified within the last year
        run: python3 scripts/check-acceptance-freshness.py

  fleet-freshness:
    name: fleet-freshness (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare FLEET.md with agent-orchestrator main
        run: |
          set -euo pipefail
          canonical="$(mktemp)"
          trap 'rm -f "$canonical"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/zubairmuwwakil/agent-orchestrator/refs/heads/main/FLEET.md" \
            --output "$canonical"
          if ! diff -u "$canonical" FLEET.md; then
            echo "::error::FLEET.md has drifted from agent-orchestrator main"
            exit 1
          fi
          echo "FLEET.md is current with agent-orchestrator main"
