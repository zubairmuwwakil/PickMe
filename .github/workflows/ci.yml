name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Named for FixtureHarnessTests (Engine/Tests/CardCopilotEngineTests/FixtureHarnessTests.swift),
  # which runs Fixtures/engine-fixtures.json — the golden-fixture spec that is the merge gate for
  # this repo's card-decision semantics (see ../../CLAUDE.md). Store tests run in the same job
  # because Store depends on Engine and both must pass to merge.
  engine-fixtures:
    name: engine-fixtures (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift & Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test Engine package
        working-directory: Engine
        run: swift test

      - name: Test Store package
        working-directory: Store
        run: swift test
