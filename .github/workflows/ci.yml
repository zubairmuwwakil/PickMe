name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Named for FixtureHarnessTests (Engine/Tests/CardCopilotEngineTests/FixtureHarnessTests.swift),
  # which runs Fixtures/engine-fixtures.json — the golden-fixture spec that is the merge gate for
  # this repo's card-decision semantics (see ../../CLAUDE.md). Store tests run in the same job
  # because Store depends on Engine and both must pass to merge.
  # The contract set is published as an immutable, content-addressed release that consumers pin
  # (contracts/RELEASE.json, scripts/release-catalogue.sh). Two mistakes must never reach main:
  # a stamp stale against the files it describes, and files changed without catalogueVersion
  # moving — which would let one published release id describe two different sets of bytes.
  # Cheap and dependency-free, so it gates every PR rather than only releases.
  catalogue-release:
    name: catalogue-release (stamp is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify RELEASE.json describes the contracts in this commit
        run: ./scripts/release-catalogue.sh --check

      # RELEASE.json only proves the bytes match what was stamped — it says nothing about
      # whether those bytes are *valid*. This is the only place card-catalogue.json,
      # benefits-catalogue.json and candidate-catalogue.json are checked against their
      # contracts/schema/*.schema.json, which is where conditional rules like cardProduct's
      # privateLabel/acceptance allOf live. programs.json shipped a schema violation for a day
      # (fixed 2026-08-27, commit 929dbb1) precisely because nothing evaluated its schema either.
      - name: Contracts validate against their JSON Schemas
        run: |
          pip install jsonschema
          python3 scripts/validate-catalogue-schema.py

      - name: Card ids are permanent
        run: scripts/check-id-permanence.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Block uncleared raw-source material
        run: scripts/check-raw-source-policy.sh

      # Merchant facts move independently from card-rate releases, so the pack has its own
      # generator check instead of being folded into RELEASE.json.
      - name: Verify merchant-pack.json matches its Swift source
        run: node scripts/generate-merchant-pack.mjs --check

  engine-fixtures:
    name: engine-fixtures (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift & Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test Engine package
        working-directory: Engine
        run: swift test

      - name: Test Store package
        working-directory: Store
        run: swift test

  # The other half of the same gate. android/core/engine reads its own copy of
  # card-catalogue.json, programs.json and owner-state.json and re-implements the scoring
  # semantics in Kotlin; FixtureHarnessTest runs the same contracts/engine-fixtures.json cases
  # as the Swift job above. Without this job the cross-language contract is asserted by nobody —
  # a catalogue change can land green on Swift while Android silently scores a different winner,
  # which is exactly what happened when scoredInV1 became requires/outOfScope.
  #
  # :core:engine is a pure Kotlin/JVM module, so this needs a JDK and nothing else — no Android
  # SDK, licenses, or emulator. Android modules are compiled in android-app-build below.
  android-engine-fixtures:
    name: engine-fixtures (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The JVM engine is compiled and tested with the project's Java 25 toolchain.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Test engine module
        working-directory: android
        run: ./gradlew --no-daemon :core:engine:test

  # This catches Android-only breakage in the store, generated Room code, Compose UI, D8, and APK
  # packaging. It intentionally avoids instrumentation tests: no emulator is needed for this gate.
  android-app-build:
    name: android app (test and assemble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          # The platform package is 'android-37.0', not 'android-37' — sdkmanager publishes
          # API 37 with a point release in the id, and the bare name resolves to nothing:
          # `Failed to find package 'platforms;android-37'`, sdkmanager exit 1, job dead
          # before Gradle runs. `sdkmanager --list` is the authority on these ids.
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Test store and assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon :core:store:testDebugUnitTest :app:assembleDebug

  # The App target is 61% of this repo's Swift (12,450 lines) and, until this job, nothing built
  # it. Engine and Store are linked as *local* packages, so a public API change in either breaks
  # the app while the three jobs above stay green. That is not hypothetical: this job's first run
  # caught CardCopilotTests calling an `OwnerState()` initialiser that does not exist and passing
  # a `programs:` argument `Catalogue` never had. The app itself compiled; only its tests did not,
  # and nothing had run them.
  #
  # `xcodebuild test` is deliberate over `build`: the CardCopilot scheme already lists
  # CardCopilotTests in its TestAction, so one invocation compiles every target and runs the
  # App-layer tests. Splitting them would build the same graph twice.
  #
  # Do NOT add `-sdk iphonesimulator` here. It overrides SDKROOT for *every* target in the build,
  # including the embedded watch app (SDKROOT = watchos, TARGETED_DEVICE_FAMILY = 4). The watch
  # app then compiles its watchOS asset catalogue for iOS and actool fails the whole build with
  # "The stickers icon set, app icon set, or icon stack named 'AppIcon' did not have any
  # applicable content" — before a single Swift file compiles. The destination alone is enough:
  # each target keeps its own SDK, and actool correctly runs --platform watchsimulator.
  # The workaround for that error is to remove -sdk, never to blank ASSETCATALOG_COMPILER_APPICON_NAME,
  # which would disable asset compilation in the very job meant to gate it.
  app-build:
    name: app (xcodebuild test)
    # Not macos-15: the watch app targets watchOS 26.2 and the iOS app iOS 18, so this needs an
    # image carrying Xcode 26.x. The Engine/Store jobs pin macos-15 because SPM needs no such SDK.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Printed unconditionally: when this job fails on a runner-image bump, the cause is almost
      # always a missing SDK or a renamed simulator, and both are invisible without this.
      - name: Toolchain and SDK inventory
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -Ei 'ios|watchos' || true

      # Simulator device names differ between runner images, so resolve one at runtime rather
      # than hardcoding a name that silently disappears on the next image update.
      - name: Select an iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, devs in sorted(devices.items()):
              if 'iOS' not in runtime:
                  continue
              for dev in devs:
                  if dev.get('isAvailable') and 'iPhone' in dev['name']:
                      print(dev['udid'])
                      raise SystemExit
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test the App target
        run: |
          xcodebuild test \
            -project App/CardCopilot.xcodeproj \
            -scheme CardCopilot \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO
