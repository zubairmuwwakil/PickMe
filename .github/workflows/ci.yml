name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Named for FixtureHarnessTests (Engine/Tests/CardCopilotEngineTests/FixtureHarnessTests.swift),
  # which runs Fixtures/engine-fixtures.json — the golden-fixture spec that is the merge gate for
  # this repo's card-decision semantics (see ../../CLAUDE.md). Store tests run in the same job
  # because Store depends on Engine and both must pass to merge.
  # The contract set is published as an immutable, content-addressed release that consumers pin
  # (contracts/RELEASE.json, scripts/release-catalogue.sh). Two mistakes must never reach main:
  # a stamp stale against the files it describes, and files changed without catalogueVersion
  # moving — which would let one published release id describe two different sets of bytes.
  # Cheap and dependency-free, so it gates every PR rather than only releases.
  catalogue-release:
    name: catalogue-release (stamp is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify RELEASE.json describes the contracts in this commit
        run: ./scripts/release-catalogue.sh --check

  engine-fixtures:
    name: engine-fixtures (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift & Xcode versions
        run: |
          swift --version
          xcodebuild -version

      - name: Test Engine package
        working-directory: Engine
        run: swift test

      - name: Test Store package
        working-directory: Store
        run: swift test

  # The other half of the same gate. android/core/engine reads its own copy of
  # card-catalogue.json, programs.json and owner-state.json and re-implements the scoring
  # semantics in Kotlin; FixtureHarnessTest runs the same contracts/engine-fixtures.json cases
  # as the Swift job above. Without this job the cross-language contract is asserted by nobody —
  # a catalogue change can land green on Swift while Android silently scores a different winner,
  # which is exactly what happened when scoredInV1 became requires/outOfScope.
  #
  # :core:engine is a pure Kotlin/JVM module, so this needs a JDK and nothing else — no Android
  # SDK, no licences, no emulator. :core:store and :app are Android library/app modules and are
  # deliberately not built here; add them only with the SDK setup they require.
  android-engine-fixtures:
    name: engine-fixtures (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain in core/engine/build.gradle.kts asks for 21; Gradle 8.11.1 does not run on 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Test engine module
        working-directory: android
        run: ./gradlew --no-daemon :core:engine:test
