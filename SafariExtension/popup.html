<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .card-meta {
      font-size: 11px;
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <h3>PickMe Copilot</h3>
  <div class="badge" id="recommendation-box">
    <div class="card-title" id="merchant-name">Scanning checkout...</div>
    <div class="card-meta" id="card-advice">Open a store page to see the highest-earning card.</div>
  </div>
  <button class="btn" id="open-app">Open PickMe App</button>
  <script src="popup.js"></script>
</body>
</html>
